name: Daily orders capture

on:
  schedule:
    - cron: "0 13 * * *"      # 13:00 UTC ≈ 09:00 ET (kaynak 00-03 ET'de yenilenir)
  workflow_dispatch: {}        # Actions sekmesinden elle de çalıştırabilirsin

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Capture today's orders file
        run: uv run python -m src.capture

      - name: Commit the captured file and log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/ingestion_log.csv
          git commit -m "Daily capture: $(date -u +%Y-%m-%d)" || echo "Nothing new to commit"
          git push