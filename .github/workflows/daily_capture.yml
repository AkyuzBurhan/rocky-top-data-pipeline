name: Daily pipeline

on:
  schedule:
    - cron: "0 13 * * *"     # 13:00 UTC ≈ 09:00 ET
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      # Stage 1: capture + commit FIRST (so the daily file is never lost)
      - name: Capture today's orders
        run: uv run python -m src.capture

      - name: Commit the captured file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/ingestion_log.csv
          git commit -m "Daily capture: $(date -u +%Y-%m-%d)" || echo "Nothing to capture-commit"
          git push

      # Stage 2: build the whole pipeline + commit the results
      - name: Build the pipeline
        run: uv run python -m src.run_pipeline

      - name: Commit the refreshed database and logs
        run: |
          git add data rocky_top.db
          git commit -m "Daily build: $(date -u +%Y-%m-%d)" || echo "Nothing to build-commit"
          git push